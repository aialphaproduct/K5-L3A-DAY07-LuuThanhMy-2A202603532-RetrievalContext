<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Ba lần chạy thật của agent</title><desc id="d">Một câu trả lời đúng, một câu từ chối đúng, một câu sai kèm nguyên nhân; lấy từ trace tập test.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/></marker></defs><rect width="1000" height="640" fill="#FFFFFF"/><text x="30" y="34" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Demo: hệ thống vận hành thế nào (3 câu thật trong tập test)</text><rect x="20" y="54" width="960" height="176" rx="12" fill="none" stroke="#0F6E56" stroke-dasharray="6 5"/><text x="36" y="78" font-size="13" font-weight="700" fill="#0F6E56" text-anchor="start">CA 1 · q14 — trả lời đúng, có nguồn</text><rect x="34" y="100" width="172" height="102" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/><text x="120.0" y="131.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Câu hỏi</text><text x="120.0" y="147.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">“Trước khi xử lý dữ liệu</text><text x="120.0" y="163.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">trẻ nhỏ, doanh nghiệp phải</text><text x="120.0" y="179.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">kiểm tra điều gì?”</text><line x1="208" y1="151" x2="212" y2="151" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="216" y="100" width="172" height="102" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/><text x="302.0" y="131.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Tìm lần 1</text><text x="302.0" y="147.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">“xử lý dữ liệu cá nhân của</text><text x="302.0" y="163.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">trẻ em bắt buộc kiểm tra”</text><text x="302.0" y="179.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">→ top: Điều 20 (a020:000)</text><line x1="390" y1="151" x2="394" y2="151" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="398" y="100" width="172" height="102" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/><text x="484.0" y="131.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Tìm lần 2 (viết lại)</text><text x="484.0" y="147.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">“trẻ em xử lý dữ liệu...</text><text x="484.0" y="163.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">đánh giá tác động”</text><text x="484.0" y="179.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">→ vẫn Điều 20 đứng đầu</text><line x1="572" y1="151" x2="576" y2="151" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="580" y="100" width="172" height="102" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/><text x="666.0" y="131.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Ngữ cảnh</text><text x="666.0" y="147.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">2 đoạn · 1379 ký tự</text><text x="666.0" y="163.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">gồm Điều 20 NĐ 13/2023</text><text x="666.0" y="179.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">(chưa chạm 2400 ký tự)</text><line x1="754" y1="151" x2="758" y2="151" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="762" y="100" width="172" height="102" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="848.0" y="131.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Trả lời</text><text x="848.0" y="147.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">“Phải xác minh tuổi của</text><text x="848.0" y="163.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">trẻ em” [nd-13-2023:</text><text x="848.0" y="179.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">struct1000:a020:000]</text><rect x="20" y="244" width="960" height="176" rx="12" fill="none" stroke="#9A5B0B" stroke-dasharray="6 5"/><text x="36" y="268" font-size="13" font-weight="700" fill="#9A5B0B" text-anchor="start">CA 2 · u03 — câu ngoài tài liệu, từ chối đúng</text><rect x="34" y="290" width="172" height="102" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/><text x="120.0" y="321.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Câu hỏi</text><text x="120.0" y="337.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">“Thủ tục đăng ký kết hôn</text><text x="120.0" y="353.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">cần những giấy tờ gì?”</text><text x="120.0" y="369.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">(không có trong 2 văn bản)</text><line x1="208" y1="341" x2="212" y2="341" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="216" y="290" width="172" height="102" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/><text x="302.0" y="321.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Tìm lần 1</text><text x="302.0" y="337.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">“thủ tục đăng ký kết hôn</text><text x="302.0" y="353.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">giấy tờ cần nộp”</text><text x="302.0" y="369.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">→ ra các mẫu phụ lục</text><line x1="390" y1="341" x2="394" y2="341" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="398" y="290" width="172" height="102" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/><text x="484.0" y="321.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Tìm lần 2 (viết lại)</text><text x="484.0" y="337.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">“đăng ký kết hôn hồ sơ tờ khai...”</text><text x="484.0" y="353.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">→ vẫn mẫu phụ lục,</text><text x="484.0" y="369.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">không liên quan</text><line x1="572" y1="341" x2="576" y2="341" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="580" y="290" width="172" height="102" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/><text x="666.0" y="321.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Ngữ cảnh</text><text x="666.0" y="337.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">2 đoạn · 2012 ký tự</text><text x="666.0" y="353.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">toàn mẫu biểu về thông báo</text><text x="666.0" y="369.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">vi phạm / thay đổi hồ sơ</text><line x1="754" y1="341" x2="758" y2="341" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="762" y="290" width="172" height="102" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="848.0" y="321.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Từ chối</text><text x="848.0" y="337.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">“Tài liệu không chứa thông tin</text><text x="848.0" y="353.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">về đăng ký kết hôn”</text><text x="848.0" y="369.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">(không dẫn nguồn)</text><rect x="20" y="434" width="960" height="176" rx="12" fill="none" stroke="#A32D2D" stroke-dasharray="6 5"/><text x="36" y="458" font-size="13" font-weight="700" fill="#A32D2D" text-anchor="start">CA 3 · q16 — trả lời sai, và vì sao</text><rect x="34" y="480" width="172" height="102" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/><text x="120.0" y="511.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Câu hỏi</text><text x="120.0" y="527.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">“Văn bản này có hiệu lực</text><text x="120.0" y="543.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">từ ngày nào?”</text><text x="120.0" y="559.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">(không nói Luật hay Nghị định)</text><line x1="208" y1="531" x2="212" y2="531" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="216" y="480" width="172" height="102" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/><text x="302.0" y="511.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Tìm lần 1</text><text x="302.0" y="527.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">→ top: Luật 91/2025</text><text x="302.0" y="543.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">a000, a005, a038</text><text x="302.0" y="559.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">(Điều 38 nói ngày hiệu lực)</text><line x1="390" y1="531" x2="394" y2="531" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="398" y="480" width="172" height="102" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/><text x="484.0" y="511.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Tìm lần 2</text><text x="484.0" y="527.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">“Nghị định 13/2023... hiệu lực”</text><text x="484.0" y="543.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">→ hạng 2: a043 của Nghị định</text><text x="484.0" y="559.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">(chính là đoạn cần tìm)</text><line x1="572" y1="531" x2="576" y2="531" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="580" y="480" width="172" height="102" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/><text x="666.0" y="511.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Ghép ngữ cảnh</text><text x="666.0" y="527.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">3 đoạn của Luật đã chiếm</text><text x="666.0" y="543.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">gần hết 2400 ký tự</text><text x="666.0" y="559.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">→ đoạn Nghị định bị bỏ</text><line x1="754" y1="531" x2="758" y2="531" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="762" y="480" width="172" height="102" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.4"/><text x="848.0" y="511.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Trả lời sai</text><text x="848.0" y="527.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">Đưa ngày của Luật</text><text x="848.0" y="543.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">(01/01/2026); đáp án đúng</text><text x="848.0" y="559.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">là 01/7/2023</text></svg>