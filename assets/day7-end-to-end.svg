<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Sơ đồ từ dữ liệu đến câu trả lời</title><desc id="d">Hai làn: kho tài liệu (Day 6) chạy một lần; hỏi đáp có agent (Day 7) chạy mỗi lần có câu hỏi.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/></marker></defs><rect width="1000" height="640" fill="#FFFFFF"/><text x="30" y="34" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Từ dữ liệu đến câu trả lời — nhìn một lần từ đầu đến cuối</text><rect x="20" y="52" width="960" height="236" rx="12" fill="none" stroke="#2B6CB0" stroke-dasharray="6 5"/><text x="36" y="76" font-size="13" font-weight="700" fill="#2B6CB0" text-anchor="start">LÀN 1 · KHO TÀI LIỆU (làm ở Day 6, chạy một lần)</text><rect x="34" y="96" width="160" height="74" rx="8" fill="#E6F1FB" stroke="#2B6CB0" stroke-width="1.4"/><text x="114.0" y="121.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">① Tài liệu gốc</text><text x="114.0" y="137.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">2 văn bản PDF</text><text x="114.0" y="153.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">62 trang</text><text x="114.0" y="192" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">Luật 91/2025/QH15</text><text x="114.0" y="207" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">NĐ 13/2023/NĐ-CP</text><line x1="196" y1="133" x2="222" y2="133" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="226" y="96" width="160" height="74" rx="8" fill="#E6F1FB" stroke="#2B6CB0" stroke-width="1.4"/><text x="306.0" y="121.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">② Đọc &amp; chuẩn hóa</text><text x="306.0" y="137.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">lấy chữ từng trang</text><text x="306.0" y="153.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">bỏ rác đầu/cuối</text><text x="306.0" y="192" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">PDF text, PyMuPDF</text><text x="306.0" y="207" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">giữ số trang gốc</text><line x1="388" y1="133" x2="414" y2="133" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="418" y="96" width="160" height="74" rx="8" fill="#E6F1FB" stroke="#2B6CB0" stroke-width="1.4"/><text x="498.0" y="121.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">③ Chia chunk</text><text x="498.0" y="137.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">theo Điều / khoản</text><text x="498.0" y="153.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">≤ 1000 ký tự</text><text x="498.0" y="192" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">172 chunk</text><text x="498.0" y="207" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">chunk_id + trang + metadata</text><line x1="580" y1="133" x2="606" y2="133" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="610" y="96" width="160" height="74" rx="8" fill="#E6F1FB" stroke="#2B6CB0" stroke-width="1.4"/><text x="690.0" y="129.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">④ Embedding</text><text x="690.0" y="145.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">chữ → vector 384 chiều</text><text x="690.0" y="192" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">multilingual-e5-small</text><text x="690.0" y="207" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">tiền tố passage: / query:</text><line x1="772" y1="133" x2="798" y2="133" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="802" y="96" width="160" height="74" rx="8" fill="#E6F1FB" stroke="#2B6CB0" stroke-width="1.4"/><text x="882.0" y="121.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">⑤ Kho vector</text><text x="882.0" y="137.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">ChromaDB</text><text x="882.0" y="153.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">cosine, HNSW</text><text x="882.0" y="192" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">tìm theo nghĩa</text><text x="882.0" y="207" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">lọc metadata</text><rect x="418" y="228" width="160" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/><text x="498.0" y="242.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">⑥ Chỉ mục BM25</text><text x="498.0" y="258.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">tìm theo từ khóa</text><text x="498.0" y="274.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">dựng từ 172 chunk ở ③</text><line x1="498" y1="212" x2="498" y2="226" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="20" y="312" width="960" height="300" rx="12" fill="none" stroke="#0F6E56" stroke-dasharray="6 5"/><text x="36" y="336" font-size="13" font-weight="700" fill="#0F6E56" text-anchor="start">LÀN 2 · HỎI – ĐÁP CÓ AGENT (làm ở Day 7, chạy mỗi lần có câu hỏi)</text><rect x="32" y="364" width="116" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="90.0" y="387.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Câu hỏi</text><text x="90.0" y="403.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">người dùng</text><text x="90.0" y="419.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">tiếng Việt</text><text x="90.0" y="456" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">query gốc,</text><text x="90.0" y="471" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">không có gold</text><rect x="168" y="364" width="116" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="226.0" y="387.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Agent</text><text x="226.0" y="403.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Claude Haiku 5.5</text><text x="226.0" y="419.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">tool use</text><text x="226.0" y="456" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">tự quyết định</text><text x="226.0" y="471" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">tìm gì, tìm mấy lần</text><rect x="304" y="364" width="140" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="374.0" y="395.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">search_documents</text><text x="374.0" y="411.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">≤ 2 lượt tìm</text><text x="374.0" y="456" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">viết lại query</text><text x="374.0" y="471" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">nếu chưa đủ</text><line x1="150" y1="399" x2="164" y2="399" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><line x1="286" y1="399" x2="300" y2="399" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="458" y="352" width="116" height="44" rx="8" fill="#FAEEDA" stroke="#9A5B0B" stroke-width="1.4"/><text x="516.0" y="370.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Dense</text><text x="516.0" y="386.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">vector Chroma</text><rect x="458" y="410" width="116" height="44" rx="8" fill="#FAEEDA" stroke="#9A5B0B" stroke-width="1.4"/><text x="516.0" y="428.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">BM25</text><text x="516.0" y="444.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">từ khóa</text><line x1="446" y1="399" x2="454" y2="374" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><line x1="446" y1="399" x2="454" y2="432" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><text x="516.0" y="472" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">hai cách tìm</text><text x="516.0" y="487" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">bổ sung nhau</text><rect x="594" y="364" width="116" height="70" rx="8" fill="#FAEEDA" stroke="#9A5B0B" stroke-width="1.4"/><text x="652.0" y="387.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Hybrid RRF</text><text x="652.0" y="403.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">trộn hai bảng</text><text x="652.0" y="419.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">xếp hạng</text><text x="652.0" y="456" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">Reciprocal Rank</text><text x="652.0" y="471" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">Fusion, k = 60</text><rect x="730" y="364" width="116" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="788.0" y="387.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Ghép ngữ cảnh</text><text x="788.0" y="403.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">bỏ trùng</text><text x="788.0" y="419.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">≤ 2400 ký tự</text><text x="788.0" y="456" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">context budget</text><text x="788.0" y="471" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">kèm nguồn + trang</text><rect x="866" y="364" width="116" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="924.0" y="387.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Kiểm citation</text><text x="924.0" y="403.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">[chunk-id] có</text><text x="924.0" y="419.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">trong ngữ cảnh?</text><text x="924.0" y="456" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">sai → bắt</text><text x="924.0" y="471" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">sửa lại</text><line x1="576" y1="374" x2="590" y2="392" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><line x1="576" y1="432" x2="590" y2="404" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><line x1="712" y1="399" x2="726" y2="399" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><line x1="848" y1="399" x2="862" y2="399" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="700" y="520" width="130" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="765.0" y="549.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Trả lời có nguồn</text><text x="765.0" y="565.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">kèm [chunk-id]</text><rect x="850" y="520" width="120" height="66" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.4"/><text x="910.0" y="549.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Từ chối</text><text x="910.0" y="565.0" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">“không đủ thông tin”</text><path d="M924 436 L924 480 L765 480 L765 518" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><path d="M924 480 L910 480 L910 518" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><text x="36" y="540" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Quy tắc xuyên suốt: chỉ trả lời từ đoạn đã tìm thấy; nếu tìm đủ mà không có thì nói</text><text x="36" y="558" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">“không đủ thông tin trong tài liệu” thay vì suy diễn ngoài tài liệu.</text><text x="36" y="590" font-size="12" font-weight="700" fill="#1f2937" text-anchor="start">Đo chất lượng: Hit@1 · Evidence Hit@3 · Context Evidence Rate · Grounded answer · Citation · Abstention</text></svg>