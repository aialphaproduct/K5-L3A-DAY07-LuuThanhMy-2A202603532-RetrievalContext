<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Day 7 - Agent tra luật</title>
<style>
:root{--ink:#1a1a1a;--muted:#5f6670;--green:#1a9a55;--blue:#2b6cb0;--card:#f3f3f3;--line:#dcdcdc;--focus:#2b6cb0;
--ok:#0f6e56;--ok-bg:#e1f5ee;--warn:#9a5b0b;--warn-bg:#faeeda;--bad:#a32d2d;--bad-bg:#fcebeb;--info-bg:#e6f1fb}
*{box-sizing:border-box}
html{background:#e9ebee}
body{margin:0;color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
.page{max-width:940px;margin:0 auto;background:#fff;min-height:100vh}

header{padding:22px 20px 0}

.sub{color:var(--blue);font-size:.9rem;margin:0 0 12px}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:0 12px}
@media(min-width:960px){nav{padding:0 26px}}
nav [role=tablist]{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}

nav button small{display:block;font-weight:400;font-size:.7rem;line-height:1.1}
nav button:hover{color:var(--ink)}nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--green)}
nav button.hot{color:var(--green)}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
main{padding:18px 20px 44px}
@media(min-width:960px){main{padding:20px 34px 44px}}
[role=tabpanel]{animation:in .25s ease both}[role=tabpanel][hidden]{display:none}
@media(prefers-reduced-motion:reduce){[role=tabpanel],.step{animation:none}}
@keyframes in{from{opacity:0}to{opacity:1}}
h2{font-size:1.15rem;margin:0 0 4px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h3{font-size:1rem;margin:20px 0 6px;font-weight:800}
.badge{font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 10px;background:var(--info-bg);color:var(--blue);white-space:nowrap}
.lead{color:var(--muted);margin:0 0 14px}
.box{background:var(--card);border-radius:14px;padding:12px 14px}
.box img{display:block;width:100%;height:auto;border-radius:10px;background:#fff}
.cap{color:var(--muted);font-size:.85rem;margin:8px 2px 0}
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:.86rem;background:#fff}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;background:#fafafa;white-space:nowrap}tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
.best{background:var(--ok-bg);font-weight:700}
.pill{border-radius:999px;padding:0 9px;font-size:.75rem;font-weight:700;white-space:nowrap}
.pill.ok,.pill.in{background:var(--ok-bg);color:var(--ok)}.pill.part,.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad,.pill.out{background:var(--bad-bg);color:var(--bad)}
.note{border-radius:10px;padding:9px 12px;margin:10px 0;font-size:.88rem}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.bad{background:var(--bad-bg);color:var(--bad)}.note.ok{background:var(--ok-bg);color:var(--ok)}.note.info{background:var(--info-bg);color:var(--blue)}
ul.tight{margin:6px 0 0;padding-left:20px}ul.tight li{margin:3px 0}
.nums,.grid3{display:grid;gap:10px;grid-template-columns:1fr;margin-top:14px}
@media(min-width:700px){.nums,.grid3{grid-template-columns:repeat(3,1fr)}}
.k{background:var(--card);border-radius:12px;padding:10px 14px}.k strong{display:block;font-size:1.3rem;line-height:1.15}.k strong i{font-style:normal;color:var(--green)}.k span{font-size:.8rem;color:var(--muted)}
.cta{margin-top:16px;min-height:44px;padding:8px 20px;border-radius:10px;border:0;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn2{min-height:44px;padding:8px 18px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn2:disabled,.c:disabled{opacity:.55;cursor:not-allowed}
pre.code{background:#1f2430;color:#e8ecf3;border-radius:10px;padding:10px 12px;overflow-x:auto;font:.82rem/1.5 Consolas,monospace;margin:6px 0}
code{background:#eef0f3;border-radius:4px;padding:0 5px;font-size:.86em}
/* ca chạy thật */
.grid{display:grid;gap:10px;grid-template-columns:1fr}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.c{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px;min-height:44px;font:inherit;color:inherit;cursor:pointer}
.c:hover{border-color:#888}.c[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.t{display:flex;align-items:center;gap:8px;font-weight:800}
.n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.8rem;flex:none}
.tag{border-radius:999px;padding:0 9px;font-size:.75rem;font-weight:700;margin-left:auto;white-space:nowrap}
.ok .tag{background:var(--ok-bg);color:var(--ok)}.warn .tag{background:var(--warn-bg);color:var(--warn)}.bad .tag{background:var(--bad-bg);color:var(--bad)}
.q{font-style:italic;font-size:.88rem;color:#333}
.s{background:var(--card);border-radius:8px;padding:5px 9px;font-size:.82rem}.s b{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.ar{text-align:center;color:#999;font-size:.7rem;line-height:1;margin:2px 0}
.res{border-radius:8px;padding:6px 9px;font-size:.84rem;font-weight:700}
.ok .res{background:var(--ok-bg);color:var(--ok)}.warn .res{background:var(--warn-bg);color:var(--warn)}.bad .res{background:var(--bad-bg);color:var(--bad)}
.go{margin-top:auto;font-size:.82rem;color:var(--blue);font-weight:600}
#out{margin-top:14px;scroll-margin-top:60px}
.state{background:var(--card);border-radius:12px;padding:16px;color:var(--muted)}.state.err{background:var(--bad-bg);color:var(--bad)}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{background:var(--card);border-radius:12px;padding:12px 14px;animation:in .3s ease both}
.step h4{display:flex;gap:9px;align-items:center;margin:0 0 6px;font-size:.95rem}
.qq{font-family:Consolas,monospace;background:var(--info-bg);color:var(--blue);padding:1px 7px;border-radius:6px;word-break:break-word}
.step table{margin-top:6px;border-radius:8px}
.bar{height:10px;border-radius:999px;background:#d9d9d9;overflow:hidden;margin:7px 0 2px}.bar i{display:block;height:100%;background:var(--green)}
.answer{white-space:pre-wrap;word-break:break-word;background:#fff;border-radius:8px;padding:9px 11px}
.cite{border:1px solid var(--blue);background:var(--info-bg);color:var(--blue);border-radius:6px;padding:0 6px;font-size:.78rem;font-weight:600;min-height:22px;font:inherit;font-size:.78rem;cursor:pointer}
.meta{color:var(--muted);font-size:.8rem;margin-top:8px}
.skip{background:none;border:0;color:var(--blue);text-decoration:underline;min-height:44px;padding:0 4px;font:inherit;cursor:pointer}
form.ask{display:flex;gap:8px;margin:18px 0 0;flex-wrap:wrap}
input[type=text]{flex:1 1 240px;min-height:44px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit}
input.sc{width:64px;min-height:34px;padding:2px 6px;border-radius:8px;border:1.5px solid var(--line);font:inherit;text-align:right}
.hint{color:var(--muted);font-size:.8rem;margin:6px 0 0}
dialog{max-width:min(640px,92vw);border:1px solid var(--line);border-radius:12px;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog pre{white-space:pre-wrap;word-break:break-word;font:inherit;margin:8px 0 0;max-height:50vh;overflow:auto}
.sum{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border-radius:12px;padding:10px 14px;margin-top:10px;font-weight:700}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.lab2{font-size:.82rem;color:var(--muted);font-weight:600;margin:10px 0 4px}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:flex;gap:6px;align-items:center;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;min-height:36px;font:inherit;font-size:.82rem;cursor:pointer}
.chip:hover{border-color:#888}
select{min-height:40px;border:1.5px solid var(--line);border-radius:10px;padding:4px 10px;background:#fff;font:inherit}
.chk{display:flex;align-items:center;gap:6px;font-size:.88rem;min-height:40px}
.qa-form{margin-top:10px}.qa-form input[type=text]{width:100%}
.grid2{display:grid;gap:10px;grid-template-columns:1fr}@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.qa-card{background:var(--card);border-radius:12px;padding:12px 14px;margin-top:12px}
.grid2 .qa-card{margin-top:0}
.qa-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.qa-step{margin:6px 0;font-size:.86rem}
.cite.dim{opacity:.55;border-style:dashed}
.gradebar{display:flex;gap:6px;flex-wrap:wrap}
.g{min-height:40px;padding:4px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:.84rem;cursor:pointer}
.g[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}

.pipe{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border-radius:12px;padding:12px 14px;margin:10px 0}
.pipe .col{display:flex;flex-direction:column;gap:6px}
.node{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;min-width:110px;text-align:center}
.node b{display:block;font-size:.88rem}.node small{color:var(--muted);font-size:.75rem}
.node.ok{border-color:var(--ok);background:var(--ok-bg)}
.node.todo{border-style:dashed;border-color:#999;background:#fafafa;color:var(--muted)}
.ar2{color:#888}

.cmd{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.cmd-top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.cmd-row{display:flex;gap:8px;align-items:stretch}
pre.cmd-code{flex:1;margin:0;white-space:pre-wrap;word-break:break-all;font-size:.9rem;display:flex;align-items:center}
.copy{flex:none;min-width:96px;min-height:44px;padding:6px 14px;border-radius:10px;border:0;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.copy.done{background:var(--ok)}
.copy-all{margin-top:2px}
.cmd-meta{color:var(--muted);font-size:.82rem;margin-top:6px}
.hint2{font-size:.78rem;font-weight:400;color:var(--muted);margin-left:8px}
@media(max-width:560px){.cmd-row{flex-direction:column}.copy{width:100%}}

.charts{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:760px){.charts{grid-template-columns:1fr 1fr}}
.chart{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.chart-t{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:6px;font-size:.9rem}
.crow{display:grid;grid-template-columns:minmax(84px,150px) 1fr minmax(76px,auto);gap:8px;align-items:center;font-size:.82rem;padding:3px 0}
.cl{overflow-wrap:anywhere}
.track{height:14px;background:#e6e6e6;border-radius:999px;overflow:hidden;display:block}
.fill{display:block;height:100%;background:#7aa7d6;border-radius:999px;transition:width .5s ease}
.fill.best{background:var(--green)}
.cv{text-align:right;white-space:nowrap}.crow.best .cv{font-weight:700;color:var(--ok)}
.star{color:#d49a00}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
.rp{min-height:36px;padding:2px 12px}
</style>
</head>
<body>
<div class="page">
<header>
  <h1>Demo: hệ thống <em>vận hành</em> thế nào?</h1>
  <p class="sub">Agent tra luật dữ liệu cá nhân · mỗi mục menu ứng với một hạng mục trong rubric để cuối cùng đối chiếu được</p>
</header>
<nav aria-label="Menu demo"><div role="tablist" id="tabs"></div></nav>
<main id="panels"><div class="state">Đang tải số liệu…</div></main>
</div>
<dialog id="dlg"><div id="dlgHead"></div><pre id="dlgBody"></pre><form method="dialog"><button class="btn2" style="margin-top:12px">Đóng</button></form></dialog>

<script>
const SRC={"luat-91-2025":"Luật 91","nd-13-2023":"NĐ 13"};
const $=(s)=>document.querySelector(s);
const h=(tag,props,...kids)=>{const e=document.createElement(tag);if(props)for(const[k,v]of Object.entries(props)){if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k.startsWith("on"))e[k]=v;else e.setAttribute(k,v)}
  kids.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(String(c)))});return e};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const shortId=(id)=>{const p=id.split(":");return (SRC[p[0]]||p[0])+" · "+p.slice(-2).join(":")};
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
const frac=(n,N)=>n+"/"+N;
const NAME={dense:"Dense (Chroma Day 6)",bm25:"BM25",hybrid_rrf:"Hybrid RRF"};
let O=null,token=0;

async function api(url,opt){const r=await fetch(url,opt);const j=await r.json().catch(()=>({error:"Phản hồi không đọc được."}));if(!r.ok)throw Object.assign(new Error(j.error||r.statusText),{detail:j.detail});return j}
function table(head,rows,opt={}){const t=h("table",null,h("thead",null,h("tr",null,head.map((x,i)=>h("th",{class:i>0&&opt.num?"num":""},x)))),
  h("tbody",null,rows.map((r,ri)=>h("tr",null,r.map((c,i)=>h("td",{class:(i>0&&opt.num?"num ":"")+((opt.best||[]).includes(ri+":"+i)?"best":"")},c))))));return h("div",{class:"tw"},t)}
function title(t,pts,rub){return h("h2",null,t,pts?h("span",{class:"badge"},"Rubric "+pts+" điểm"):null)}
function note(kind,text){return h("div",{class:"note "+kind},text)}

/* ---------- 3 ca chạy thật: chạy agent THẬT, phát từng bước ngay khi xảy ra (có phát lại trace để dự phòng) ---------- */
const CASES=[
 {id:"q14",kind:"ok",tag:"có đáp án",title:"Có bằng chứng",q:"“Trước khi xử lý dữ liệu trẻ nhỏ phải kiểm tra gì?”",watch:"Quan sát: agent tìm đúng điều luật rồi trả lời kèm nguồn [chunk-id]; bấm vào nguồn để đọc đoạn."},
 {id:"u03",kind:"warn",tag:"ngoài tài liệu",title:"Thiếu bằng chứng",q:"“Thủ tục đăng ký kết hôn cần giấy tờ gì?”",watch:"Quan sát: tìm đủ lượt mà không thấy → từ chối, không dẫn nguồn."},
 {id:"q16",kind:"bad",tag:"câu mơ hồ",title:"Dễ sai",q:"“Văn bản này có hiệu lực từ ngày nào?”",watch:"Quan sát: câu không nói Luật hay Nghị định; so với đáp án chuẩn để xem agent xử lý ra sao."}];

async function openChunk(id){try{const c=await api("/api/chunk?id="+encodeURIComponent(id));$("#dlgHead").textContent=shortId(c.id)+" · trang "+c.page;$("#dlgBody").textContent=c.text;$("#dlg").showModal()}catch(e){alert(e.message)}}
function withCites(text){const f=document.createDocumentFragment();let last=0;const re=/\[([\w\-]+:[\w\-]+:\w+:\d+)\]/g;let m;
  while((m=re.exec(text))){f.append(text.slice(last,m.index));f.append(h("button",{class:"cite",type:"button",onclick:()=>openChunk(m[1])},"["+shortId(m[1])+"]"));last=re.lastIndex}
  f.append(text.slice(last));return f}
function stepCard(n,t){return h("li",{class:"step"},h("h4",null,h("span",{class:"n"},n),h("span",null,t)))}
function qCard(question){const s=stepCard(1,"Câu hỏi");s.append(h("div",null,question));return s}
function searchCard(st,i){const s=stepCard(i+2,"Tìm lần "+(i+1)+(i?" (agent viết lại query)":""));
  s.append(h("div",null,"Query: ",h("span",{class:"qq"},st.query)));
  s.append(table(["Hạng","Đoạn","Trang","Điểm","Ngữ cảnh"],st.results.map(x=>[x.rank,h("button",{class:"cite",type:"button",onclick:()=>openChunk(x.id)},shortId(x.id)),x.page,x.score.toFixed(3),h("span",{class:"pill "+(x.in_context?"in":"out")},x.in_context?"được giữ":"bị bỏ")])));
  const d=st.results.filter(x=>!x.in_context).length;if(d)s.append(note("warn",d+" đoạn tìm được nhưng không vào ngữ cảnh vì đã hết ngân sách ký tự."));return s}
function ctxCard(r){const s=stepCard(r.steps.length+2,"Ghép ngữ cảnh gửi model"),used=r.steps.length?r.steps[r.steps.length-1].context_chars:0;
  s.append(h("div",null,used+" / "+r.budget+" ký tự · "+r.context.length+" đoạn: "+(r.context.map(c=>shortId(c.id)).join(", ")||"không có")),
    h("div",{class:"bar"},h("i",{style:"width:"+Math.min(100,used*100/r.budget)+"%"})));return s}
function ansCard(r){const s=stepCard(r.steps.length+3,r.status==="answered"?"Agent trả lời":"Agent từ chối (không đủ thông tin)");
  s.append(h("div",{class:"qa-head"},h("span",{class:"pill "+(r.mode==="live"?"ok":"part")},r.mode==="live"?"chạy agent thật":"phát lại trace đã lưu")));
  const a=h("div",{class:"answer"});a.append(withCites(r.answer||"(không có nội dung)"));s.append(a);
  if(r.preset||r.mode==="replay")s.append(note("info",r.expected?"Đáp án chuẩn (benchmark): "+r.expected+" — anh tự đối chiếu với câu trả lời ở trên.":"Đáp án chuẩn: không có trong tài liệu — agent nên từ chối."));
  s.append(h("div",{class:"meta"},r.usage.llm_calls+" lượt gọi model · "+r.usage.input_tokens+" token vào / "+r.usage.output_tokens+" ra · "+(r.elapsed_ms/1000).toFixed(1)+" giây"));return s}
function buildSteps(r){return [qCard(r.question),...r.steps.map(searchCard),ctxCard(r),ansCard(r)]}

function setBusy(on){document.querySelectorAll(".c,.rp").forEach(b=>b.disabled=on);$("#out").setAttribute("aria-busy",on)}
function fail(e,presetId){const d=h("div",{class:"state err"},h("b",null,e.message||"Có lỗi xảy ra."));
  if(e.detail)d.append(h("details",null,h("summary",null,"Chi tiết kỹ thuật"),h("pre",null,e.detail)));
  if(presetId)d.append(h("br"),h("button",{class:"skip",onclick:()=>runReplay(presetId)},"Xem bản phát lại từ trace đã lưu (không cần API)"));
  $("#out").replaceChildren(d)}
async function runLive(c){
  const my=++token,out=$("#out"),ol=h("ol",{class:"steps"}),wait=h("div",{class:"state"},"Đang kết nối agent thật…"),t0=Date.now();
  out.replaceChildren(ol,wait);setBusy(true);if(!reduce)out.scrollIntoView({behavior:"smooth",block:"start"});
  let base="Đang kết nối agent thật…",idx=0;const tick=setInterval(()=>{wait.textContent=base+" ("+Math.round((Date.now()-t0)/1000)+" giây)"},1000);
  const handle=(ev)=>{if(my!==token)return;
    if(ev.type==="status"){base=ev.message}
    else if(ev.type==="start"){ol.append(qCard(ev.question));base="Agent đang tìm tài liệu"}
    else if(ev.type==="search"){ol.append(searchCard(ev.step,idx++));base="Agent đọc kết quả và quyết định bước tiếp"}
    else if(ev.type==="final"){ol.append(ctxCard(ev.result),ansCard(ev.result));wait.remove()}
    else if(ev.type==="error"){throw Object.assign(new Error(ev.message),{detail:ev.detail})}};
  try{
    const resp=await fetch("/api/ask_stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({preset:c.id,config:"imp3"})});
    if(!resp.ok){const j=await resp.json().catch(()=>({}));throw Object.assign(new Error(j.error||resp.statusText),{detail:j.detail})}
    const rd=resp.body.getReader(),dec=new TextDecoder();let buf="";

/* ---------- Biểu đồ cột (giống biểu đồ trong terminal: python -m agentrag.chart) ---------- */
const SHORT={base:"base · dense · 800",imp1:"imp1 · hybrid · 800",imp2:"imp2 · hybrid · 2400",imp3:"imp3 · hybrid · 2400 · filter",imp4:"imp4 · hybrid · 2400 · rerank"};
function barChart(title,hint,rows,max,fmt,better){
  const vals=rows.map(r=>r[1]),target=better==="min"?Math.min(...vals):Math.max(...vals),multi=new Set(vals).size>1;
  const box=h("div",{class:"chart",role:"group","aria-label":title});
  box.append(h("div",{class:"chart-t"},h("b",null,title),hint?h("span",{class:"hint2"},hint):null));
  rows.forEach(([label,v])=>{const best=multi&&v===target,w=max>0?Math.max(v>0?3:0,Math.round(1000*v/max)/10):0;
    box.append(h("div",{class:"crow"+(best?" best":"")},h("span",{class:"cl"},label),
      h("span",{class:"track","aria-hidden":"true"},h("i",{class:"fill"+(best?" best":""),style:"width:"+w+"%"})),
      h("span",{class:"cv"},fmt(v),best?h("span",{class:"star",title:"tốt nhất trong nhóm"}," ★"):null)))});
  return box}
const fr=(N)=>(v)=>v+"/"+N+" · "+Math.round(100*v/N)+"%";
function toggleCharts(opts){ // opts: [[nhãn, hàm dựng danh sách biểu đồ]]
  const holder=h("div",{class:"charts"}),bar=h("div",{class:"gradebar",role:"group","aria-label":"Chọn tập dữ liệu"});
  const show=(i)=>{holder.replaceChildren(...opts[i][1]());bar.querySelectorAll(".g").forEach((b,k)=>b.setAttribute("aria-pressed",k===i?"true":"false"))};
  opts.forEach((o,i)=>bar.append(h("button",{class:"g",type:"button","aria-pressed":"false",onclick:()=>show(i)},o[0])));
  show(0);return h("div",null,bar,h("div",{style:"height:8px"}),holder)}
function retrChart(){
  const R=O.retrieval,ms=["dense","bm25","hybrid_rrf"];
  const dev=()=>{const d=R.dev800.methods,d24=R.dev2400.methods,N=d.dense.n_answerable,pick=(src,k)=>ms.map(m=>[NAME[m],src[m][k]]);
    return [barChart("Hit@1 — đoạn hạng 1 chứa evidence","càng cao càng tốt",pick(d,"hit1"),N,fr(N)),
      barChart("Evidence Hit@3 — top-3 có evidence","càng cao càng tốt",pick(d,"evidence_hit3"),N,fr(N)),
      barChart("Ngữ cảnh còn evidence — budget 800","chunk ~1000 ký tự không vừa thì bị bỏ",pick(d,"context_evidence_rate"),N,fr(N)),
      barChart("Ngữ cảnh còn evidence — budget 2400","đủ chỗ cho chunk",pick(d24,"context_evidence_rate"),N,fr(N)),
      barChart("Thời gian tìm trung vị (ms)","càng thấp càng nhanh",pick(d,"median_ms"),Math.max(...ms.map(m=>d[m].median_ms)),(v)=>v.toFixed(1)+" ms","min")]};
  const test=()=>{const t=R.test800.methods,N=t.dense.n_answerable,pick=(k)=>ms.map(m=>[NAME[m],t[m][k]]);
    return [barChart("Hit@1 — test","chỉ 5 câu: chênh 1 câu chưa đủ để kết luận",pick("hit1"),N,fr(N)),
      barChart("Evidence Hit@3 — test","",pick("evidence_hit3"),N,fr(N)),
      barChart("Ngữ cảnh còn evidence — budget 800 (test)","",pick("context_evidence_rate"),N,fr(N)),
      barChart("Thời gian tìm trung vị (ms) — test","càng thấp càng nhanh",pick("median_ms"),Math.max(...ms.map(m=>t[m].median_ms)),(v)=>v.toFixed(1)+" ms","min")]};
  return toggleCharts([["Dev (15 câu)",dev],["Test (5 câu)",test]])}
function evalChart(){
  const D=O.agent_dev,T=O.agent_test,M=O.metrics_test,cf=["base","imp1","imp2","imp3"].concat(O.agent_dev.imp4?["imp4"]:[]);
  const dev=()=>{const N=D.base.answerable,U=D.base.unanswerable,lab=(c)=>SHORT[c],pick=(k)=>cf.map(c=>[lab(c),D[c][k]]);
    const tok=cf.map(c=>[lab(c),D[c].input_tokens/1000]);
    return [barChart("Evidence còn trong ngữ cảnh gửi model","càng cao càng tốt",pick("context_evidence"),N,fr(N)),
      barChart("Trả lời được câu có đáp án","",pick("answered_answerable"),N,fr(N)),
      barChart("Từ chối nhầm (câu có đáp án)","càng thấp càng tốt",pick("abstain_answerable"),N,fr(N),"min"),
      barChart("Từ chối đúng (câu thiếu bằng chứng)","",pick("abstain_unanswerable"),U,fr(U)),
      barChart("Token đầu vào (nghìn) — chi phí","càng thấp càng rẻ",tok,Math.max(...tok.map(r=>r[1])),(v)=>Math.round(v)+"k","min")]};
  const test=()=>{const c2=["base","imp3"].concat(T.imp4&&M.imp4?["imp4"]:[]),N=T.base.answerable,U=T.base.unanswerable,pick=(k)=>c2.map(c=>[SHORT[c],T[c][k]]);
    return [barChart("Evidence còn trong ngữ cảnh — test","",pick("context_evidence"),N,fr(N)),
      barChart("Từ chối nhầm — test","càng thấp càng tốt",pick("abstain_answerable"),N,fr(N),"min"),
      barChart("Từ chối đúng — test","",pick("abstain_unanswerable"),U,fr(U)),
      barChart("Grounded answer trung bình (0–2)","nhãn nháp AI",c2.map(c=>[SHORT[c],M[c].grounded_answer.mean||0]),2,(v)=>v.toFixed(2)+"/2")]};
  return toggleCharts([["Dev ("+cf.length+" cấu hình)",dev],["Test ("+(T.imp4?"base, imp3, imp4":"base vs imp3")+")",test]])}

function rerankChart(){
  const pairs=[["dense","dense_rerank"],["bm25","bm25_rerank"],["hybrid_rrf","hybrid_rerank"]];
  const build=(data,label)=>()=>{const M=data.methods,N=M.dense.n_answerable,rows=(k)=>pairs.flatMap(([b,r])=>[[NAME[b]+" (trước)",M[b][k]],[NAME[b]+" + rerank (sau)",M[r][k]]]);
    const cand=pairs.map(([b,r])=>[NAME[b]+" (top-20)",M[r].candidate_recall]),ms=rows("median_ms");
    return [barChart("Hit@1 — đoạn hạng 1 chứa evidence",label,rows("hit1"),N,fr(N)),
      barChart("Evidence Hit@3 — top-3 có evidence","",rows("evidence_hit3"),N,fr(N)),
      barChart("Ngữ cảnh còn evidence (budget 2400)","",rows("context_evidence_rate"),N,fr(N)),
      barChart("Trần của rerank: evidence có trong 20 candidate","rerank không cứu được câu mà candidate không có evidence",cand,N,fr(N)),
      barChart("Thời gian trung vị (ms) — chi phí của rerank","càng thấp càng nhanh",ms,Math.max(...ms.map(r=>r[1])),(v)=>Math.round(v)+" ms","min")]};
  const opts=[["Dev (15 câu)",build(O.rerank,"càng cao càng tốt")]];
  if(O.rerank_test)opts.push(["Test (5 câu, xem sau khi chốt)",build(O.rerank_test,"test đã chạm trần nên ít thấy khác biệt")]);
  return h("div",null,h("p",{class:"hint"},"Trước = retriever gốc lấy top-3. Sau = lấy 20 candidate rồi xếp lại bằng cross-encoder BAAI/bge-reranker-v2-m3, lấy top-3. Cùng corpus, budget "+O.retrieval.dev2400.budget+" ký tự. Thời gian đo trên CPU: mỗi truy vấn rerank mất khoảng 24–40 giây, đây là chi phí lớn nhất của rerank."),
    toggleCharts(opts))}

      "q07 (hộ kinh doanh) và q13 (thời hạn xóa 72 giờ): đoạn đúng không lọt top-3 ở cả ba phương pháp. Đã thử rerank: với câu hỏi gốc cứu được q13 (Hit@3 13 → 14/15) nhưng q07 vẫn thiếu; ở agent, imp4 vẫn thiếu evidence ở q05, q07, q13 (12/15), giả thuyết: query agent viết lại làm lệch.",

 ["Retrieval","≥ 3 phương pháp, gồm dense Day 6",10,"retrieval","ok","đã làm 4/6 phương pháp gợi ý (dense, BM25, hybrid RRF, rerank) trên cùng corpus và câu hỏi; rerank so trước/sau trên dev"],

 ["Đánh giá","Retrieval/context metrics, so sánh kiểm chứng được",9,"eval","ok","Hit@1, Hit@3, Context Evidence Rate trên dev và test"],

 ["Thử nghiệm và cải thiện","≥ 2 cấu hình cải thiện, giả thuyết, phân tích lỗi",5,"experiments","ok","imp1, imp2 (+ imp3 filter chưa kiểm chứng), 2 lỗi dev"],
 ["","Chọn trên dev, đánh giá test sau khi chốt",5,"experiments","ok","tiêu chí ghi trước, test chạy một lần"],

 ["Tái lập và báo cáo","Code, cách chạy, model, dữ liệu",5,"repro","ok","có RUN.md, DEMO.md, mã nguồn agentrag/; đã push lên repo cá nhân (cần kiểm quyền xem của người chấm)"],

const ST={ok:["ok","có bằng chứng"],part:["part","có, còn hạn chế"],bad:["bad","chưa"]};
const LS="day7-selfscore";
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return {}}}
function lsSet(v){try{localStorage.setItem(LS,JSON.stringify(v))}catch(e){}}
function rubricPanel(){const saved=lsGet(),total=RUBRIC.reduce((a,r)=>a+r[2],0),sum=h("span",null);
  const calc=()=>{let s=0,filled=0;document.querySelectorAll("input.sc").forEach(i=>{if(i.value!==""){s+=Number(i.value);filled++}});
    sum.textContent=filled?"Tự chấm: "+s+" / "+total+" điểm ("+filled+"/"+RUBRIC.length+" dòng)":"Tự chấm: chưa nhập — điền điểm của giảng viên hoặc của anh để so sánh"};
  const rows=RUBRIC.map((r,i)=>{const inp=h("input",{class:"sc",type:"number",min:"0",max:String(r[2]),step:"0.5","aria-label":"Điểm tự chấm: "+r[1]+" (tối đa "+r[2]+")",value:saved[i]??""});
    inp.oninput=()=>{const v=Math.max(0,Math.min(r[2],Number(inp.value)));if(inp.value!==""&&v!==Number(inp.value))inp.value=v;const s=lsGet();if(inp.value==="")delete s[i];else s[i]=inp.value;lsSet(s);calc()};
    return [r[0],r[1],r[2],h("span",{class:"pill "+ST[r[4]][0]},ST[r[4]][1]),r[5],h("button",{class:"skip",onclick:()=>go(r[3])},"xem →"),inp]});
  const t=table(["Hạng mục","Tiêu chí","Tối đa","Mức đáp ứng","Bằng chứng","Mở","Tự chấm"],rows);

const built={};
function go(id,push=true){const t=TABS.find(x=>x[0]===id)||TABS[0];id=t[0];
  document.querySelectorAll("#tabs button").forEach(b=>{const on=b.dataset.id===id;b.setAttribute("aria-selected",on);b.tabIndex=on?0:-1;if(on&&!reduce)b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})});
  const box=$("#panels");let p=built[id];if(!p){p=h("div",{role:"tabpanel",id:"p-"+id,"aria-labelledby":"t-"+id});try{p.append(t[3]())}catch(e){p.append(h("div",{class:"state err"},"Không dựng được mục này: "+e.message))}built[id]=p}

function buildMenu(){const bar=$("#tabs");TABS.forEach(t=>{const b=h("button",{role:"tab",id:"t-"+t[0],"data-id":t[0],"aria-controls":"p-"+t[0],"aria-selected":"false",class:t[4]||"",onclick:()=>go(t[0])},t[1],h("small",null,t[2]||" "));bar.append(b)});
  bar.addEventListener("keydown",(e)=>{const i=TABS.findIndex(t=>t[0]===(document.activeElement.dataset||{}).id);if(i<0)return;const k={ArrowRight:1,ArrowLeft:-1}[e.key];if(!k)return;
    const n=TABS[(i+k+TABS.length)%TABS.length][0];go(n);$("#t-"+n).focus();e.preventDefault()})}

  go((location.hash||"#overview").slice(1),false)}
window.addEventListener("hashchange",()=>go((location.hash||"#overview").slice(1),false));
